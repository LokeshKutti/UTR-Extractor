# Render Blueprint for the backend API -- no Docker. Render's native Python
# runtime builds this straight from requirements.txt plus the build/start
# commands below; see DEPLOY.md for why the build command is two pip calls
# instead of one, and for the matching Vercel setup for the frontend.
services:
  - type: web
    name: utr-extractor-api
    runtime: python
    plan: free
    buildCommand: >-
      pip install --no-deps rapidocr-onnxruntime==1.2.3 &&
      pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: PUBLIC_DEPLOYMENT
        value: "1"
      # Render's free tier caps a service at 512MB RAM. Investigated down to
      # the exact mechanism: RapidOCR's detection network scales every image
      # up to at least 736px on its shorter side by default, and running that
      # through the network -- not model loading, not variant count, not
      # thread pools (all tried and ruled out first) -- is what produces a
      # per-call memory spike close to the ceiling. DET_LIMIT_SIDE_LEN below
      # (see core.py) addresses that directly: measured to cut peak memory by
      # roughly 40% with zero accuracy loss across the full regression suite.
      # MAX_ACCURACY_TIER stays capped at "fast" for now as a second, already-
      # proven-safe layer; worth revisiting once the primary fix is confirmed
      # live, since a smaller detection pass makes the heavier tiers cheaper
      # too.
      - key: MAX_ACCURACY_TIER
        value: fast
      - key: DET_LIMIT_SIDE_LEN
        value: "480"
      # The deployed Vercel URL isn't known until that side is set up, so
      # this is left for you to fill in on Render's dashboard rather than
      # hardcoded here. Comma-separate more than one if you add a custom
      # domain later; Vercel's own preview-deploy URLs are covered
      # automatically (see server.py's CORS setup).
      - key: ALLOWED_ORIGIN
        sync: false
